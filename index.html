<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET 2027 Command Center</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div class="sticky top-0 z-50 bg-slate-900 border-b border-slate-700 shadow-md">
        <div class="p-4 flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">🎯 NEET 2027 COMMAND CENTER</h1>
                <p class="text-sm text-slate-400 mt-1">Operation: 140+ Physics | Time: 14-Hour Shift</p>
            </div>
            <div class="flex space-x-2">
                <button id="tab-schedule" onclick="switchTab('schedule')" class="px-4 py-2 rounded font-medium bg-blue-600 text-white transition-colors">Master Schedule</button>
                <button id="tab-routine" onclick="switchTab('routine')" class="px-4 py-2 rounded font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors">Daily Routine</button>
            </div>
        </div>
    </div>

    <main class="w-full max-w-5xl mx-auto p-4 md:p-6 pb-20">
        
        <!-- TAB 1: MASTER SCHEDULE -->
        <div id="view-schedule" class="block">
            <div id="schedule-container" class="space-y-6 relative z-10">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- TAB 2: DAILY ROUTINE -->
        <div id="view-routine" class="hidden">
            <div class="bg-slate-800 rounded-lg p-4 md:p-6 shadow border border-slate-700 mb-6">
                <h2 class="text-lg font-bold mb-4">Set Your Start Time</h2>
                <div class="flex flex-wrap gap-3 items-center">
                    <select id="time-hour" class="bg-slate-900 border border-slate-600 text-white p-2 rounded focus:outline-none focus:border-blue-500">
                        <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    </select>
                    <span class="font-bold">:</span>
                    <select id="time-min" class="bg-slate-900 border border-slate-600 text-white p-2 rounded focus:outline-none focus:border-blue-500">
                        <option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option>
                    </select>
                    <select id="time-ampm" class="bg-slate-900 border border-slate-600 text-white p-2 rounded focus:outline-none focus:border-blue-500">
                        <option value="AM">AM</option><option value="PM">PM</option>
                    </select>
                    <button onclick="generateRoutine()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded transition-colors ml-auto md:ml-4">Generate 14-Hr Shift</button>
                </div>
            </div>

            <div id="routine-container" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script>
        const chapters = [
            "[PHY] Units & Measurements", "[CHEM] Basic Concepts", "[BIO] Living World", "[PHY] Motion in a Straight Line", "[CHEM] Structure of Atom", "[BIO] Biological Class.",
            "[PHY] Motion in a Plane", "[CHEM] Classification of Elements", "[BIO] Plant Kingdom", "[PHY] Laws of Motion", "[CHEM] Chemical Bonding", "[BIO] Animal Kingdom",
            "[PHY] Work, Energy, Power", "[CHEM] Thermodynamics (Chem)", "[BIO] Morphology of Plants", "[PHY] Rotational Motion", "[CHEM] Equilibrium", "[BIO] Anatomy of Plants",
            "[PHY] Gravitation", "[CHEM] Redox Reactions", "[BIO] Structural Org. Animals", "[PHY] Solids", "[CHEM] Solutions", "[BIO] Cell: Unit of Life",
            "[PHY] Fluids", "[CHEM] Electrochemistry", "[BIO] Biomolecules", "[PHY] Thermal Properties", "[CHEM] Chemical Kinetics", "[BIO] Cell Cycle",
            "[PHY] Thermodynamics", "[CHEM] d and f Block", "[BIO] Photosynthesis", "[PHY] Kinetic Theory", "[CHEM] Coordination Compounds", "[BIO] Respiration",
            "[PHY] Oscillations", "[CHEM] Organic - Basic Principles", "[BIO] Plant Growth", "[PHY] Waves", "[CHEM] Hydrocarbons", "[BIO] Breathing & Exchange",
            "[PHY] Charges & Fields", "[CHEM] Haloalkanes", "[BIO] Body Fluids", "[PHY] Potential & Cap", "[CHEM] Alcohols", "[BIO] Excretory Products",
            "[PHY] Current Electricity", "[CHEM] Aldehydes & Ketones", "[BIO] Locomotion & Movement", "[PHY] Moving Charges", "[CHEM] Amines", "[BIO] Neural Control",
            "[PHY] Magnetism & Matter", "[CHEM] Biomolecules (Chem)", "[BIO] Chemical Coord.", "[PHY] EMI", "[BIO] Sexual Repro. Plants", "[PHY] Alternating Current",
            "[BIO] Human Reproduction", "[PHY] EM Waves", "[BIO] Reproductive Health", "[PHY] Ray Optics", "[BIO] Principles of Inheritance", "[PHY] Wave Optics",
            "[BIO] Molecular Basis", "[PHY] Dual Nature", "[BIO] Evolution", "[PHY] Atoms", "[BIO] Human Health & Disease", "[PHY] Nuclei",
            "[BIO] Microbes", "[PHY] Semiconductors", "[BIO] Biotech: Principles", "[BIO] Biotech: Apps", "[BIO] Organisms & Pops", "[BIO] Ecosystem", "[BIO] Biodiversity"
        ];

        function switchTab(tab) {
            const btnSched = document.getElementById('tab-schedule');
            const btnRout = document.getElementById('tab-routine');
            const viewSched = document.getElementById('view-schedule');
            const viewRout = document.getElementById('view-routine');

            if (tab === 'schedule') {
                btnSched.className = "px-4 py-2 rounded font-medium bg-blue-600 text-white transition-colors";
                btnRout.className = "px-4 py-2 rounded font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors";
                viewSched.classList.remove('hidden'); viewSched.classList.add('block');
                viewRout.classList.remove('block'); viewRout.classList.add('hidden');
            } else {
                btnRout.className = "px-4 py-2 rounded font-medium bg-blue-600 text-white transition-colors";
                btnSched.className = "px-4 py-2 rounded font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors";
                viewRout.classList.remove('hidden'); viewRout.classList.add('block');
                viewSched.classList.remove('block'); viewSched.classList.add('hidden');
                
                let savedTime = localStorage.getItem('neet_routine_start') || '03:00:PM';
                let [h, m, a] = savedTime.split(':');
                document.getElementById('time-hour').value = h;
                document.getElementById('time-min').value = m;
                document.getElementById('time-ampm').value = a;
                generateRoutine();
            }
        }

        function generateSchedule() {
            const container = document.getElementById('schedule-container');
            let currentDate = new Date(2026, 10, 27); 
            const endDate = new Date(2027, 4, 1);     
            
            let html = '';
            let currentMonth = -1;
            let chapterIndex = 0;

            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            while (currentDate <= endDate) {
                const m = currentDate.getMonth();
                const d = currentDate.getDay();
                
                if (m !== currentMonth) {
                    html += `
                        <div class="sticky top-[70px] md:top-[80px] bg-slate-900/95 backdrop-blur-sm pt-4 pb-2 z-20 border-b border-slate-700">
                            <h2 class="text-xl font-black text-slate-200 tracking-wider">${monthNames[m]} ${currentDate.getFullYear()}</h2>
                        </div>`;
                    currentMonth = m;
                }

                const dateStr = `${dayNames[d]}, ${monthNames[m].substring(0,3)} ${currentDate.getDate()}, ${currentDate.getFullYear()}`;
                const isoDate = currentDate.toISOString().split('T')[0];
                let savedVal = localStorage.getItem('neet_sched_' + isoDate) || "";

                if (d === 0) {
                    html += `
                        <div class="flex flex-col md:flex-row p-3 rounded-lg border border-red-900/50 bg-red-950/20">
                            <div class="w-full md:w-32 flex-shrink-0 font-medium text-red-400 mb-2 md:mb-0">${dateStr}</div>
                            <div class="flex-grow font-bold text-red-400 pl-0 md:pl-4">⚠️ SUNDAY: REVISION & MOCK TEST</div>
                        </div>`;
                } else {
                    let defaultChap = chapterIndex < chapters.length ? chapters[chapterIndex] : "Revision / Mock";
                    let displayVal = savedVal !== "" ? savedVal : defaultChap;
                    let phase = currentDate < new Date(2027, 2, 1) ? "1" : (currentDate < new Date(2027, 3, 15) ? "2" : "3");

                    html += `
                        <div class="flex flex-col md:flex-row p-3 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition-colors group">
                            <div class="w-full md:w-32 flex-shrink-0 font-medium text-slate-400 mb-2 md:mb-0 flex items-center gap-2">
                                <span>${dateStr}</span>
                            </div>
                            <div class="flex-grow pl-0 md:pl-4 flex items-center gap-3">
                                <span class="text-[10px] font-bold px-2 py-1 rounded bg-slate-700 text-slate-300 tracking-wider">PHASE ${phase}</span>
                                <input type="text" id="date-${isoDate}" onchange="saveSchedule('${isoDate}')" value="${displayVal}" 
                                       class="w-full bg-transparent border-b border-transparent group-hover:border-slate-600 focus:border-blue-500 focus:outline-none text-slate-200 py-1 font-medium transition-colors">
                            </div>
                        </div>`;
                    chapterIndex++;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            container.innerHTML = html;
        }

        function saveSchedule(dateIso) {
            localStorage.setItem('neet_sched_' + dateIso, document.getElementById('date-' + dateIso).value);
        }

        function formatTime(totalMins) {
            let m = totalMins % (24 * 60);
            let hours = Math.floor(m / 60);
            let mins = m % 60;
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')} ${ampm}`;
        }

        function generateRoutine() {
            const h = document.getElementById('time-hour').value;
            const m = document.getElementById('time-min').value;
            const a = document.getElementById('time-ampm').value;
            localStorage.setItem('neet_routine_start', `${h}:${m}:${a}`);

            let hour24 = parseInt(h);
            if (a === 'PM' && hour24 !== 12) hour24 += 12;
            if (a === 'AM' && hour24 === 12) hour24 = 0;
            
            const startMins = (hour24 * 60) + parseInt(m);
            const container = document.getElementById('routine-container');
            let html = '';
            
            let elapsed = 0;
            let currentMins = startMins;
            let blockNum = 1;

            while (elapsed < 840) {
                let blockDur = 50;
                if (elapsed + blockDur > 840) blockDur = 840 - elapsed;

                let savedType = localStorage.getItem('neet_routine_type_' + blockNum) || "Study";
                let savedBlock = localStorage.getItem('neet_routine_block_' + blockNum) || "";

                // Dynamic UI Setup Based on Dropdown Selection
                let bgClass = "bg-slate-800 border-slate-700";
                let textClass = "text-slate-100";
                let badgeClass = "bg-blue-900/50 text-blue-300";
                let placeholderText = "Enter topic / Questions...";

                if (["Dinner", "Lunch", "Breakfast"].includes(savedType)) {
                    bgClass = "bg-orange-950/20 border-orange-500 border-l-4";
                    badgeClass = "bg-orange-900/50 text-orange-300";
                    placeholderText = "Watch Tarak Mehta / Eat...";
                } else if (savedType === "Snacks") {
                    bgClass = "bg-yellow-950/20 border-yellow-500 border-l-4";
                    badgeClass = "bg-yellow-900/50 text-yellow-300";
                    placeholderText = "Light snack time...";
                } else if (savedType === "Break") {
                    bgClass = "bg-emerald-950/20 border-emerald-500 border-l-4";
                    badgeClass = "bg-emerald-900/50 text-emerald-300";
                    placeholderText = "Relax / Free Fire break...";
                }

                html += `
                    <div class="flex flex-col md:flex-row p-3 rounded-lg border ${bgClass} transition-colors">
                        <div class="w-full md:w-24 text-sm font-medium text-slate-400 mb-2 md:mb-0 flex items-center">${formatTime(currentMins)}</div>
                        <div class="flex-grow pl-0 md:pl-4 flex flex-col md:flex-row md:items-center gap-2">
                            
                            <!-- DYNAMIC TYPE SELECTOR -->
                            <select id="routine-type-${blockNum}" onchange="saveRoutineType(${blockNum})" class="border border-slate-600 rounded p-1.5 text-xs font-bold focus:outline-none focus:border-blue-500 ${badgeClass} cursor-pointer">
                                <option value="Study" ${savedType === 'Study' ? 'selected' : ''}>📘 STUDY</option>
                                <option value="Breakfast" ${savedType === 'Breakfast' ? 'selected' : ''}>🍳 BREAKFAST</option>
                                <option value="Lunch" ${savedType === 'Lunch' ? 'selected' : ''}>🍱 LUNCH</option>
                                <option value="Snacks" ${savedType === 'Snacks' ? 'selected' : ''}>🥪 SNACKS</option>
                                <option value="Dinner" ${savedType === 'Dinner' ? 'selected' : ''}>🍔 DINNER</option>
                                <option value="Break" ${savedType === 'Break' ? 'selected' : ''}>🧘 FREE BREAK</option>
                            </select>

                            <span class="text-xs font-bold px-2 py-1 rounded bg-slate-800 text-slate-400 hidden md:inline-block">${blockDur}m</span>

                            <input type="text" id="routine-block-${blockNum}" onchange="saveRoutine(${blockNum})" value="${savedBlock}" placeholder="${placeholderText}" 
                                   class="w-full bg-slate-900/50 border border-slate-600 rounded p-2 text-sm ${textClass} focus:border-blue-500 focus:outline-none">
                        </div>
                    </div>`;
                
                currentMins += blockDur; elapsed += blockDur;

                if (elapsed < 840) {
                    let breakDur = 7;
                    if (elapsed + breakDur > 840) breakDur = 840 - elapsed;

                    if (breakDur > 0) {
                        html += `
                            <div class="flex items-center p-2 rounded border border-slate-700/50 bg-slate-800/30">
                                <div class="w-24 text-xs text-slate-500">${formatTime(currentMins)}</div>
                                <div class="flex-grow text-xs font-medium text-slate-400 pl-4">☕ Short Break (${breakDur}m)</div>
                            </div>`;
                        currentMins += breakDur; elapsed += breakDur;
                    }
                }
                blockNum++;
            }

            html += `
                <div class="flex items-center p-4 rounded-lg border-l-4 border-indigo-500 bg-indigo-950/30 mt-4">
                    <div class="w-24 text-sm font-medium text-indigo-400">${formatTime(currentMins)}</div>
                    <div class="flex-grow font-black text-indigo-400 pl-4 uppercase tracking-wider">🛌 Wrap Up & Sleep</div>
                </div>`;

            container.innerHTML = html;
        }

        function saveRoutineType(blockId) {
            localStorage.setItem('neet_routine_type_' + blockId, document.getElementById('routine-type-' + blockId).value);
            generateRoutine(); // UI तुरंत अपडेट करने के लिए
        }

        function saveRoutine(blockId) {
            localStorage.setItem('neet_routine_block_' + blockId, document.getElementById('routine-block-' + blockId).value);
        }

        window.onload = () => { generateSchedule(); };
    </script>
    
    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('SW Registered'));
        }
    </script>
</body>
</html>
